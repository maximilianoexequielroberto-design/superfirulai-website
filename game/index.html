<style>
:root{--bg:#e3ecff;--ink:#14173a;--card:#ffffff;--blue:#1e4fd8;--red:#e23b3b;--gold:#f5b301;--mut:#4a4f78;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b2a;--ink:#f1f4ff;--card:#141a47;--mut:#aab2e6}}
:root[data-theme="dark"]{--bg:#070b2a;--ink:#f1f4ff;--card:#141a47;--mut:#aab2e6}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:3px solid var(--ink);background:var(--card)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem}
.mini{width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;vertical-align:middle}
.hud{display:flex;gap:12px;align-items:center;font-weight:900;font-variant-numeric:tabular-nums}
#nv{font-weight:900;color:var(--mut)}
#sc{font-size:1.3rem;min-width:2ch;text-align:right}
#lv{display:flex;gap:3px}
#stage{flex:1;position:relative;min-height:0;touch-action:none;background:#070b2a}
canvas{display:block;position:absolute;inset:0}
#cb{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2500;font-weight:900;padding:4px 14px;border-radius:999px;border:3px solid #14173a;pointer-events:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,30,.55)}
.card{max-width:420px;width:100%;box-sizing:border-box;background:var(--card);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--red);border-radius:16px;padding:18px 20px 14px;text-align:center}
.logo{width:116px;height:116px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 0 3px var(--ink),0 0 26px rgba(245,179,1,.55);object-fit:cover;margin-top:-62px}
.card h2{margin:10px 0 6px;font-size:1.7rem;font-weight:900;line-height:1.1}
.card p{margin:8px 0;line-height:1.45}
.big{font-size:2.4rem;font-weight:900;color:var(--blue)}
.rec{display:inline-block;background:var(--gold);color:#3a2500;font-weight:900;border-radius:999px;padding:2px 12px;border:2px solid var(--ink)}
.fine{font-size:.78rem;color:var(--mut)}
.legend{display:flex;justify-content:center;gap:14px;font-size:.88rem;font-weight:700;margin:10px 0}
button{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:10px;padding:10px 22px;margin:6px 4px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--ink)}
button.ghost{background:var(--card);color:var(--ink)}
button.sm{padding:4px 10px;margin:0;box-shadow:2px 2px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>

  for(var j=parts.length-1;j>=0;j--){var p=parts[j];p.l-=dt;if(p.l<=0){parts.splice(j,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=S*6*dt;cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,S*.07,0,6.28);cx.fill()}

    cx.save();cx.translate(dogX,dY);cx.rotate(Math.max(-.25,Math.min(.25,vx*.0004)));cx.scale(1+.12*sq,1-.1*sq);if(inv>0&&Math.floor(tm*14)%2)cx.globalAlpha=.4;
    if(mult>1){cx.shadowColor='#f5b301';cx.shadowBlur=S*.5}
    cx.beginPath();cx.arc(0,0,R,0,6.28);cx.save();cx.clip();

    cx.restore();cx.shadowBlur=0;cx.strokeStyle='#f5b301';cx.lineWidth=S*.07;cx.beginPath();cx.arc(0,0,R,0,6.28);cx.stroke();

    cx.restore();

  }
